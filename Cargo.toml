[package]
name = "stellar-music-contracts"
version = "1.1.0"
edition = "2021"
description = "Decentralized music streaming and automated royalty settlement protocol on Soroban"
license = "Apache-2.0"
repository = "https://github.com/Stellar-Music/stellar-music-contracts"
keywords = ["soroban", "stellar", "music", "streaming", "royalty-settlement"]
categories = ["cryptography::cryptocurrencies", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.6"

[dev-dependencies]
soroban-sdk = { version = "22.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
